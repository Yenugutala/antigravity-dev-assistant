# AI Pipeline Accelerator — Configuration
# This file is read by all pipeline code. No hardcoded values in code.

environment: "trial"          # community, trial, or prod

# Databricks schemas (databases)
schemas:
  bronze: "b_salesorders"
  silver: "s_salesorders"
  gold: "g_salesorders"

storage_root: "dbfs:/FileStore"

# Source API
source_api: "https://api.sales-hub.com"

# Table names — Bronze layer
tables:
  bronze:
    products: "b_salesorders.products"
    carts: "b_salesorders.carts"
    users: "b_salesorders.users"

  # Table names — Silver layer
  silver:
    products: "s_salesorders.products"
    orders: "s_salesorders.orders"
    customers: "s_salesorders.customers"
    quarantine: "s_salesorders.orders_quarantine"

  # Table names — Gold layer
  gold:
    revenue_by_category: "g_salesorders.revenue_by_category"
    order_summary: "g_salesorders.order_summary"
