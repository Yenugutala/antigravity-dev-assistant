# AI Pipeline Accelerator — Configuration
# This file is read by all pipeline code. No hardcoded values in code.

environment: "trial"          # community, trial, or prod

# Databricks schemas (databases)
schemas:
  bronze: "b_antigravity_sales"
  silver: "s_antigravity_sales"
  gold: "g_antigravity_sales"

storage_root: "dbfs:/FileStore"

# Source API
source_api: "https://dummyjson.com"

# Table names — Bronze layer
tables:
  bronze:
    products: "b_antigravity_sales.products"
    carts: "b_antigravity_sales.carts"
    users: "b_antigravity_sales.users"

  # Table names — Silver layer
  silver:
    products: "s_antigravity_sales.products"
    orders: "s_antigravity_sales.orders"
    customers: "s_antigravity_sales.customers"
    quarantine: "s_antigravity_sales.orders_quarantine"

  # Table names — Gold layer
  gold:
    revenue_by_category: "g_antigravity_sales.revenue_by_category"
    order_summary: "g_antigravity_sales.order_summary"
